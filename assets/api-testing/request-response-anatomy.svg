<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of an API request and response</title>
  <desc id="desc">A GET request to https://pokeapi.co/api/v2/pokemon/pikachu split into method, base URL, resource and path parameter, followed by the request and response parts: method, headers and body on one side; status, headers and JSON body on the other.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  </style>

  <rect x="0" y="0" width="960" height="540" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="959" height="539" rx="16" fill="none" stroke="#e5e7eb"/>

  <text x="480" y="44" text-anchor="middle" class="sans" font-size="22" font-weight="700" fill="#111827">One request, one response</text>

  <!-- URL breakdown -->
  <g class="mono" font-size="19" font-weight="600" text-anchor="middle">
    <rect x="123" y="70" width="70" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/>
    <text x="158" y="99" fill="#1e3a8a">GET</text>

    <rect x="201" y="70" width="360" height="44" rx="8" fill="#f3f4f6" stroke="#6b7280"/>
    <text x="381" y="99" fill="#111827">https://pokeapi.co/api/v2</text>

    <rect x="569" y="70" width="130" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="634" y="99" fill="#4c1d95">/pokemon</text>

    <rect x="707" y="70" width="130" height="44" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="772" y="99" fill="#78350f">/pikachu</text>
  </g>
  <g class="sans" font-size="14" text-anchor="middle" fill="#374151">
    <text x="158" y="138">Method</text>
    <text x="381" y="138">Base URL</text>
    <text x="634" y="138">Resource</text>
    <text x="772" y="138">Path parameter</text>
  </g>
  <text x="480" y="168" text-anchor="middle" class="sans" font-size="14" fill="#6b7280">Filters and pages go in query parameters:
    <tspan class="mono" fill="#111827">/pokemon?limit=5&amp;offset=0</tspan>
  </text>

  <!-- Request card -->
  <rect x="40" y="200" width="380" height="300" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M40 212 a12 12 0 0 1 12 -12 h356 a12 12 0 0 1 12 12 v30 h-380 z" fill="#2563eb"/>
  <text x="230" y="228" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1">REQUEST</text>

  <g class="sans" font-size="15" font-weight="700" fill="#1f2937">
    <text x="62" y="278">Method</text>
    <text x="62" y="338">Headers</text>
    <text x="62" y="398">Body</text>
  </g>
  <g class="mono" font-size="14" fill="#111827">
    <text x="160" y="278">GET</text>
    <text x="160" y="338">Accept: application/json</text>
    <text x="160" y="398">(empty)</text>
  </g>
  <g class="sans" font-size="13" fill="#6b7280">
    <text x="160" y="298">what to do with the resource</text>
    <text x="160" y="358">extra info: format, auth token…</text>
    <text x="160" y="418">data sent with POST, PUT, PATCH</text>
  </g>

  <!-- Arrows -->
  <g stroke="#374151" stroke-width="2.5" fill="none">
    <line x1="428" y1="300" x2="522" y2="300"/>
    <polyline points="512,292 524,300 512,308"/>
    <line x1="532" y1="400" x2="438" y2="400"/>
    <polyline points="448,392 436,400 448,408"/>
  </g>
  <g class="sans" font-size="13" text-anchor="middle" fill="#374151">
    <text x="480" y="288">sent</text>
    <text x="480" y="424">returned</text>
  </g>

  <!-- Response card -->
  <rect x="540" y="200" width="380" height="300" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
  <path d="M540 212 a12 12 0 0 1 12 -12 h356 a12 12 0 0 1 12 12 v30 h-380 z" fill="#16a34a"/>
  <text x="730" y="228" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1">RESPONSE</text>

  <g class="sans" font-size="15" font-weight="700" fill="#1f2937">
    <text x="562" y="278">Status</text>
    <text x="562" y="328">Headers</text>
    <text x="562" y="378">Body</text>
  </g>
  <rect x="650" y="261" width="78" height="24" rx="12" fill="#dcfce7" stroke="#16a34a"/>
  <text x="689" y="278" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#14532d">200 OK</text>
  <text x="650" y="328" class="mono" font-size="13" fill="#111827">Content-Type: application/json</text>
  <g class="mono" font-size="13" fill="#111827">
    <text x="650" y="378">{</text>
    <text x="666" y="398">"id": 25,</text>
    <text x="666" y="418">"name": "pikachu",</text>
    <text x="666" y="438">"types": [ "electric" … ],</text>
    <text x="666" y="458">…</text>
    <text x="650" y="478">}</text>
  </g>
</svg>
